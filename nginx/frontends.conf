# Host-installed Nginx; certificates must exist before enabling this file.
map $http_upgrade $aerocrm_connection_upgrade { default upgrade; "" close; }
server { listen 80; server_name aerocrm.space;
  location /.well-known/acme-challenge/ { root /var/www/aerocrm-acme; }
  location / { return 301 https://$host$request_uri; }
}
server { listen 443 ssl http2; server_name aerocrm.space;
  ssl_certificate /etc/letsencrypt/live/aerocrm.space/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/aerocrm.space/privkey.pem;
  client_max_body_size 25m;
  location = /downloads/aeroCRM.apk {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    if ($args) { return 400; }
    proxy_pass https://s3.twcstorage.ru/content-files/aerocrm/android/1.0.0/aeroCRM.apk;
    proxy_ssl_server_name on;
    proxy_ssl_name s3.twcstorage.ru;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 3;
    # Forward only the fixed host and range headers, never browser credentials.
    proxy_set_header Host s3.twcstorage.ru;
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_buffering off;
    proxy_intercept_errors on;
    error_page 301 302 303 307 308 = @apk_upstream_redirect;
    proxy_hide_header Location;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Cache-Control;
    proxy_hide_header Content-Disposition;
    add_header Content-Disposition 'attachment; filename="aeroCRM.apk"' always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location @apk_upstream_redirect { return 502; }
  location / {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $aerocrm_connection_upgrade;
  }
}
