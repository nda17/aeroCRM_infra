# Host-installed Nginx; certificates must exist before enabling this file.
map $http_upgrade $aerocrm_connection_upgrade { default upgrade; "" close; }
server { listen 80; server_name aerocrm.space;
  location /.well-known/acme-challenge/ { root /var/www/aerocrm-acme; }
  location / { return 301 https://$host$request_uri; }
}
server { listen 443 ssl http2; server_name aerocrm.space;
  ssl_certificate /etc/letsencrypt/live/aerocrm.space/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/aerocrm.space/privkey.pem;
  client_max_body_size 25m;
  location / {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $aerocrm_connection_upgrade;
  }
}
