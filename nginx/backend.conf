# Gateway is the only public backend upstream.
server { listen 80; server_name api.aerocrm.space;
  location /.well-known/acme-challenge/ { root /var/www/aerocrm-acme; }
  location / { return 301 https://$host$request_uri; }
}
server { listen 443 ssl http2; server_name api.aerocrm.space;
  ssl_certificate /etc/letsencrypt/live/api.aerocrm.space/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.aerocrm.space/privkey.pem;
  client_max_body_size 25m;
  location / {
    proxy_pass http://127.0.0.1:4100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
