name: Infrastructure CI
on:
  push:
    branches: ['dev_*.*.*/**', prod_0.1.0]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Validate release contracts and rollback failures
        run: |
          bash -n scripts/release.sh
          bash -n scripts/ensure-cutover-node.sh
          bash -n scripts/aerocrm-nginx-release.sh
          node --check scripts/frontend-edge-recovery.mjs
          node --test scripts/frontend-edge-recovery.test.mjs
          python3 -c "from pathlib import Path; compile(Path('scripts/frontend-edge-configure.py').read_text(), 'scripts/frontend-edge-configure.py', 'exec')"
          node --test scripts/frontend-edge-configure.test.mjs
          node --check scripts/backend-release.mjs
          node --check scripts/backend-release-state.mjs
          node --check scripts/backend-release-transaction.mjs
          node --check scripts/backend-mail-env.mjs
          node --check scripts/backend-rabbitmq-config.mjs
          node --check scripts/backend-image-inventory.mjs
          node --check scripts/backend-image-cleanup.mjs
          node --check scripts/crm-file-imports-migration.mjs
          node --check scripts/crm-sales-reminder-fk-migration.mjs
          node --check scripts/crm-sales-stage-next-action-migration.mjs
          node --check scripts/crm-sales-stage-duration-migration.mjs
          node --check scripts/risk-controls-migration.mjs
          node --check scripts/risk-controls-capabilities.mjs
          node --check scripts/backend-risk-controls-env.mjs
          node --check scripts/backend-s3-principals.mjs
          node --test scripts/risk-controls.test.mjs
          node --check scripts/database-maintenance-release.mjs
          node --check scripts/database-maintenance-rehearsal.mjs
          node --check scripts/crm-ux-unification-migration.mjs
          node --check scripts/workspace-collaboration-migration.mjs
          node --check scripts/meeting3-migration.mjs
          node --check scripts/backend-chat-env.mjs
          node --check scripts/backend-runtime-storage-env.mjs
          node --check scripts/backend-telegram-business-env.mjs
          node --check scripts/telegram-business-migration.mjs
          node --check scripts/backend-reliability-env.mjs
          node --check scripts/backend-reliability-recovery.mjs
          node --check scripts/render-env.mjs
          node --check scripts/crm-reliability-migration.mjs
          node --check scripts/reliability-s3-probe.mjs
          node --check scripts/telegram-business-webhook.mjs
          node --check scripts/backend-rollback-compatibility-guard.mjs
          python3 -c "from pathlib import Path; compile(Path('scripts/telegram-business-relay.py').read_text(), 'scripts/telegram-business-relay.py', 'exec')"
          python3 scripts/telegram-business-relay.test.py
          node --check scripts/runtime-storage-copy.cjs
          node --check scripts/chat-storage-probe.cjs
          node --test scripts/backend-release-state.test.mjs scripts/backend-release-transaction.test.mjs scripts/backend-mail-env.test.mjs scripts/backend-chat-env.test.mjs scripts/backend-runtime-storage-env.test.mjs scripts/backend-telegram-business-env.test.mjs scripts/backend-reliability-recovery.test.mjs scripts/render-env.test.mjs scripts/runtime-storage-copy.test.cjs scripts/chat-storage-probe.test.cjs
          node --test scripts/backend-release-rabbitmq-config.test.mjs
          node --test scripts/backend-image-cleanup.test.mjs
          bash scripts/release.sh --policy-self-test
          node scripts/backend-rollback-compatibility-guard.mjs --policy-self-test
          node scripts/workspace-closure-enable.mjs --policy-self-test
          node scripts/crm-file-imports-migration.mjs --policy-self-test
          node scripts/crm-sales-reminder-fk-migration.mjs --policy-self-test
          node scripts/crm-sales-stage-next-action-migration.mjs --policy-self-test
          node scripts/crm-sales-stage-duration-migration.mjs --policy-self-test
          node scripts/database-maintenance-release.mjs --policy-self-test
          node scripts/database-maintenance-rehearsal.mjs --policy-self-test
          node scripts/crm-ux-unification-migration.mjs --policy-self-test
          node scripts/workspace-collaboration-migration.mjs --policy-self-test
          node scripts/meeting3-migration.mjs --policy-self-test
          node scripts/telegram-business-migration.mjs --policy-self-test
          node scripts/crm-reliability-migration.mjs --policy-self-test
          node scripts/reliability-s3-probe.mjs --policy-self-test
          CRM_RUNTIME_STORAGE_INSTALL=true node scripts/meeting3-migration.mjs --policy-self-test
      - name: Match production Docker image store
        uses: docker/setup-docker-action@v5
        with:
          version: 'v29.8.1'
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - name: Match production Docker Compose
        uses: docker/setup-compose-action@v2
        with:
          version: 'v5.5.1'
      - name: Verify production Docker versions
        run: |
          test "$(docker version --format '{{.Server.Version}}')" = '29.8.1'
          compose_version=$(docker compose version --short)
          test "${compose_version#v}" = '5.5.1'
      - name: Prove Nginx 1.18 starts without S3 DNS and recovers at request time
        env:
          AEROCRM_REQUIRE_DOCKER: '1'
        run: node --test scripts/nginx-s3-dns.integration.test.mjs
      - name: Execute generated CRM reliability ACL on PostgreSQL 18
        run: node --test scripts/crm-reliability-acl-postgres18.test.mjs
      - name: Verify Compose preserves unaffected containers
        env:
          REQUIRE_DOCKER_COMPOSE_TEST: 'true'
        run: node --test scripts/backend-release-compose.integration.test.mjs scripts/backend-release-rabbitmq-compose.integration.test.mjs
