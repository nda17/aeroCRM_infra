name: aerocrm-backend
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    network_mode: host
    env_file: ../env/backend/postgres.env
    volumes:
      - postgres_data:/var/lib/postgresql
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 10
  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    network_mode: host
    env_file: ../env/backend/rabbitmq.env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    environment:
      RABBITMQ_NODE_IP_ADDRESS: 127.0.0.1
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  api-gateway:
    image: aerocrm/api-gateway:${IMAGE_SHA:?exact release SHA required}
    restart: unless-stopped
    network_mode: host
    env_file: ../env/backend/api-gateway.env
    environment:
      APP_REVISION: ${IMAGE_SHA}
      NODE_ENV: production
    security_opt:
      - no-new-privileges:true
  notification-delivery-worker:
    image: aerocrm/notification-delivery:${IMAGE_SHA:?exact release SHA required}
    restart: unless-stopped
    network_mode: host
    env_file: ../env/backend/notification-delivery-worker.env
    environment:
      APP_REVISION: ${IMAGE_SHA}
      NODE_ENV: production
    security_opt:
      - no-new-privileges:true
  campaigns-service:
